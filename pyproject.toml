[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PassBeacon"
version = "1.0.0"
description = "Satellite tracking and ground-station pass prediction"
requires-python = ">=3.12"
dependencies = ["fastapi==0.138.1", "uvicorn==0.49.0", "websockets>=13,<17", "skyfield==1.54", "requests==2.34.2"]

[project.optional-dependencies]
tools = ["rich==15.0.0"]

[project.scripts]
sattrack = "sattrack.cli:main"
sattrack-server = "sattrack.server:main"

[tool.setuptools.packages.find]
where = ["backend"]
